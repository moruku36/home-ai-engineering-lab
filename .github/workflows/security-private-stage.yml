name: Private security library candidate
on:
  push:
    branches:
      - 'codex/private-security-libraries-20261024'
    paths:
      - 'scripts/security_summary.py'
      - 'scripts/dependabot_metrics.py'
      - 'tests/security_private_libraries_test.py'
      - '.github/workflows/security-private-stage.yml'
  pull_request:
    paths:
      - 'scripts/security_summary.py'
      - 'scripts/dependabot_metrics.py'
      - 'tests/security_private_libraries_test.py'
      - '.github/workflows/security-private-stage.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p security_private_libraries_test.py -v
